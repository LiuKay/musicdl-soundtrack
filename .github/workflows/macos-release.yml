name: macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          make app
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/Soundtrack.app "Soundtrack-macOS-${RELEASE_TAG}.zip"
      # ponytail: the Release asset is enough; do not duplicate it as an Actions artifact.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "Soundtrack-macOS-${RELEASE_TAG}.zip" --clobber
