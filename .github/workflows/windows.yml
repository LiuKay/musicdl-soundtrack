name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: pwsh
        run: .\build-windows.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          $app = Start-Process '.\dist\Soundtrack\Soundtrack.exe' -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Soundtrack exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\Soundtrack -DestinationPath "Soundtrack-Windows-$env:RELEASE_TAG.zip" -Force
      # ponytail: the Release asset is enough; do not duplicate it as an Actions artifact.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" "Soundtrack-Windows-$env:RELEASE_TAG.zip" --clobber
